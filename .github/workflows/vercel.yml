name: Verify and deploy SaansAI to Vercel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    if: vars.SAANS_VERCEL_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@latest
      - name: Pull Vercel environment (preview)
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel artifact (preview)
        if: github.event_name == 'pull_request'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy preview to Vercel
        id: deploy_preview
        if: github.event_name == 'pull_request'
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - name: Pull Vercel environment (production)
        if: github.event_name != 'pull_request'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel artifact (production)
        if: github.event_name != 'pull_request'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production to Vercel
        id: deploy_prod
        if: github.event_name != 'pull_request'
        run: |
          log=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /dev/stderr)
          alias_url=$(printf '%s\n' "$log" | grep 'Aliased' | grep -Eo 'https://[^[:space:]]+' | tail -n 1 || true)
          deploy_url=$(printf '%s\n' "$log" | grep 'Production' | grep -Eo 'https://[^[:space:]]+' | tail -n 1 || true)
          echo "url=${alias_url:-$deploy_url}" >> "$GITHUB_OUTPUT"
      - name: Smoke test deployed Vercel instance
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_URL: ${{ steps.deploy_prod.outputs.url }}
        run: node scripts/smoke.mjs "$DEPLOY_URL"
